// DEFAULT CHARACTER: the same clean, rounded block-style avatar for every player.
function createCharacter() {
  const group = new THREE.Group();
  const animatedBody = new THREE.Group();
  group.add(animatedBody);

  // Everyone receives the same starter colours. Outfit customization comes later.
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0c9a7, roughness: 0.82 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0xd7e6dc, roughness: 0.9 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x45546a, roughness: 0.95 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0xf3f0e8, roughness: 0.85 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x292b2b, roughness: 0.6 });
  const mouthMat = new THREE.MeshStandardMaterial({ color: 0x9b625b, roughness: 0.8 });

  function roundedPart(parent, width, height, depth, material, position, radius = 0.07) {
    const mesh = new THREE.Mesh(
      new RoundedBoxGeometry(width, height, depth, 3, radius),
      material
    );
    mesh.position.set(position.x, position.y, position.z);
    parent.add(mesh);
    return mesh;
  }

  // Neck and softly rounded torso.
  roundedPart(animatedBody, 0.24, 0.22, 0.24, skinMat, { x: 0, y: 1.61, z: 0 }, 0.06);
  roundedPart(animatedBody, 0.88, 0.91, 0.48, shirtMat, { x: 0, y: 1.18, z: 0 }, 0.10);

  // Head: a rounded cube, deliberately left without hair or accessories.
  roundedPart(animatedBody, 0.78, 0.76, 0.72, skinMat, { x: 0, y: 2.08, z: 0 }, 0.16);

  // Simple friendly face on the front (-Z) of the head.
  for (const x of [-0.145, 0.145]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 8), eyeMat);
    eye.scale.set(0.82, 1.12, 0.42);
    eye.position.set(x, 2.13, -0.357);
    animatedBody.add(eye);
  }
  const smileCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.085, 1.94, -0.362),
    new THREE.Vector3(-0.045, 1.915, -0.369),
    new THREE.Vector3(0, 1.91, -0.371),
    new THREE.Vector3(0.045, 1.915, -0.369),
    new THREE.Vector3(0.085, 1.94, -0.362)
  ]);
  const smile = new THREE.Mesh(new THREE.TubeGeometry(smileCurve, 12, 0.012, 6, false), mouthMat);
  animatedBody.add(smile);

  // Pivoted arms allow natural swinging instead of sliding block limbs.
  const leftArm = new THREE.Group();
  leftArm.position.set(-0.53, 1.53, 0);
  animatedBody.add(leftArm);
  roundedPart(leftArm, 0.30, 0.72, 0.36, skinMat, { x: 0, y: -0.34, z: 0 }, 0.075);
  roundedPart(leftArm, 0.25, 0.23, 0.30, skinMat, { x: 0, y: -0.76, z: -0.015 }, 0.07);

  const rightArm = new THREE.Group();
  rightArm.position.set(0.53, 1.53, 0);
  animatedBody.add(rightArm);
  roundedPart(rightArm, 0.30, 0.72, 0.36, skinMat, { x: 0, y: -0.34, z: 0 }, 0.075);
  roundedPart(rightArm, 0.25, 0.23, 0.30, skinMat, { x: 0, y: -0.76, z: -0.015 }, 0.07);

  // Pivoted legs with simple light shoes.
  const leftLeg = new THREE.Group();
  leftLeg.position.set(-0.23, 0.77, 0);
  animatedBody.add(leftLeg);
  roundedPart(leftLeg, 0.37, 0.70, 0.40, pantsMat, { x: 0, y: -0.34, z: 0 }, 0.065);
  roundedPart(leftLeg, 0.39, 0.20, 0.51, shoeMat, { x: 0, y: -0.70, z: -0.055 }, 0.065);

  const rightLeg = new THREE.Group();
  rightLeg.position.set(0.23, 0.77, 0);
  animatedBody.add(rightLeg);
  roundedPart(rightLeg, 0.37, 0.70, 0.40, pantsMat, { x: 0, y: -0.34, z: 0 }, 0.065);
  roundedPart(rightLeg, 0.39, 0.20, 0.51, shoeMat, { x: 0, y: -0.70, z: -0.055 }, 0.065);

  // Floating name label. A blank name hides it.
  const labelCanvas = document.createElement("canvas");
  labelCanvas.width = 512;
  labelCanvas.height = 128;
  const labelContext = labelCanvas.getContext("2d");
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  const labelMaterial = new THREE.SpriteMaterial({ map: labelTexture, transparent: true, depthWrite: false });
  const labelSprite = new THREE.Sprite(labelMaterial);
  labelSprite.position.y = 2.88;
  labelSprite.scale.set(2.15, 0.54, 1);
  labelSprite.visible = false;
  group.add(labelSprite);

  function setName(name) {
    const safeName = String(name || "").trim().slice(0, 20);
    labelContext.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    if (!safeName) {
      labelSprite.visible = false;
      labelTexture.needsUpdate = true;
      return;
    }
    labelContext.fillStyle = "rgba(25, 42, 30, 0.72)";
    labelContext.beginPath();
    if (typeof labelContext.roundRect === "function") {
      labelContext.roundRect(22, 18, 468, 92, 28);
    } else {
      labelContext.rect(22, 18, 468, 92);
    }
    labelContext.fill();
    labelContext.fillStyle = "#ffffff";
    labelContext.font = "bold 48px Arial";
    labelContext.textAlign = "center";
    labelContext.textBaseline = "middle";
    labelContext.fillText(safeName, 256, 65, 430);
    labelSprite.visible = true;
    labelTexture.needsUpdate = true;
  }

  function updateAnimation(isMoving, isAirborne, time) {
    if (isAirborne) {
      leftLeg.rotation.x = 0.22;
      rightLeg.rotation.x = -0.22;
      leftArm.rotation.x = -0.48;
      rightArm.rotation.x = -0.48;
      animatedBody.position.y = 0;
      return;
    }
    if (isMoving) {
      const swing = Math.sin(time * 11.5) * 0.58;
      leftLeg.rotation.x = swing;
      rightLeg.rotation.x = -swing;
      leftArm.rotation.x = -swing * 0.72;
      rightArm.rotation.x = swing * 0.72;
      animatedBody.position.y = Math.abs(Math.sin(time * 11.5)) * 0.035;
    } else {
      leftLeg.rotation.x = THREE.MathUtils.damp(leftLeg.rotation.x, 0, 12, 1 / 60);
      rightLeg.rotation.x = THREE.MathUtils.damp(rightLeg.rotation.x, 0, 12, 1 / 60);
      leftArm.rotation.x = Math.sin(time * 1.8) * 0.025;
      rightArm.rotation.x = -Math.sin(time * 1.8) * 0.025;
      animatedBody.position.y = Math.sin(time * 2) * 0.012;
    }
  }

  return { group, setName, updateAnimation };
}

// MOBILE JOYSTICK
const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");
let stickPointer = null;
function moveStick(event) {
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;
  const maxDistance = 38;
  const distance = Math.hypot(dx, dy);
  if (distance > maxDistance) {
    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }
  stickX = dx / maxDistance;
  stickY = -dy / maxDistance;
  knob.style.left = `calc(50% + ${dx}px)`;
  knob.style.top = `calc(50% + ${dy}px)`;
}
joystick.addEventListener("pointerdown", event => {
  if (!joined) return;
  stickPointer = event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveStick(event);
});
joystick.addEventListener("pointermove", event => {
  if (event.pointerId === stickPointer) moveStick(event);
});
function releaseStick(event) {
  if (event.pointerId !== stickPointer) return;
  stickPointer = null;
  stickX = 0;
  stickY = 0;
  knob.style.left = "50%";
  knob.style.top = "50%";
}
joystick.addEventListener("pointerup", releaseStick);
joystick.addEventListener("pointercancel", releaseStick);

// CAMERA LOOK AND MOBILE PINCH ZOOM
const canvas = renderer.domElement;

const lookPointers = new Map();
let lookPointer = null;
let previousX = 0;
let lastPinchDistance = null;

function getTouchPoints() {
  return [...lookPointers.values()].filter(
    point => point.pointerType === "touch"
  );
}

function getPinchDistance(points) {
  return Math.hypot(
    points[0].x - points[1].x,
    points[0].y - points[1].y
  );
}

canvas.addEventListener("pointerdown", event => {
  if (!joined) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  canvas.setPointerCapture(event.pointerId);

  lookPointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY,
    pointerType: event.pointerType
  });

  const touches = getTouchPoints();

  if (touches.length >= 2) {
    lastPinchDistance = getPinchDistance(touches);
    lookPointer = null;
  } else {
    lookPointer = event.pointerId;
    previousX = event.clientX;
  }
});

canvas.addEventListener("pointermove", event => {
  const point = lookPointers.get(event.pointerId);
  if (!point) return;

  point.x = event.clientX;
  point.y = event.clientY;

  const touches = getTouchPoints();

  if (touches.length >= 2) {
    const distance = getPinchDistance(touches);

    if (lastPinchDistance !== null) {
      targetCameraDistance = THREE.MathUtils.clamp(
        targetCameraDistance +
        (lastPinchDistance - distance) * 0.025,
        minCameraDistance,
        maxCameraDistance
      );
    }

    lastPinchDistance = distance;
    lookPointer = null;
    return;
  }

  if (event.pointerId === lookPointer) {
    const difference = event.clientX - previousX;
    cameraYaw -= difference * 0.006;
    previousX = event.clientX;
  }
});

function stopLooking(event) {
  lookPointers.delete(event.pointerId);

  const touches = getTouchPoints();

  if (touches.length === 1) {
    lastPinchDistance = null;
    lookPointer = touches[0].id;
    previousX = touches[0].x;
  } else if (touches.length === 0) {
    lastPinchDistance = null;
    if (event.pointerId === lookPointer) lookPointer = null;
  }
}

canvas.addEventListener("pointerup", stopLooking);
canvas.addEventListener("pointercancel", stopLooking);

// PC MOUSE WHEEL ZOOM
canvas.addEventListener("wheel", event => {
  if (!joined) return;

  event.preventDefault();

  targetCameraDistance = THREE.MathUtils.clamp(
    targetCameraDistance + event.deltaY * 0.012,
    minCameraDistance,
    maxCameraDistance
  );
}, { passive: false });

// CAMERA START POSITION
camera.position.set(0, 5.5, 17);
camera.lookAt(player.position.x, 1.5, player.position.z);

// MULTIPLAYER HELPERS
function updatePlayerStatus() {
  const count = 1 + remotePlayers.size;
  if (count === 1) {
    playerStatus.textContent = "Connected · waiting for your friend...";
  } else if (count === 2) {
    playerStatus.textContent = "You're together! ✨";
  } else {
    playerStatus.textContent = `${count} players are here.`;
  }
}

function validPlayerData(data) {
  return data && Number.isFinite(data.x) && Number.isFinite(data.z) &&
    Number.isFinite(data.rotationY) && Number.isFinite(data.updatedAt) &&
    (data.y === undefined || Number.isFinite(data.y));
}

function upsertRemotePlayer(uid, data) {
  if (uid === myUid || !validPlayerData(data)) return;
  const safeY = THREE.MathUtils.clamp(Number.isFinite(data.y) ? data.y : 0, 0, 4);
  let remote = remotePlayers.get(uid);

  if (!remote) {
    const character = createCharacter();
    scene.add(character.group);
    character.group.position.set(data.x, safeY, data.z);
    character.group.rotation.y = data.rotationY;

    remote = {
      group: character.group,
      setName: character.setName,
      updateAnimation: character.updateAnimation,
      targetX: data.x,
      targetY: safeY,
      targetZ: data.z,
      targetRotationY: data.rotationY
    };

    remotePlayers.set(uid, remote);
  }

  remote.targetX = THREE.MathUtils.clamp(data.x, -115, 115);
  remote.targetY = safeY;
  remote.targetZ = THREE.MathUtils.clamp(data.z, -115, 115);
  remote.targetRotationY = data.rotationY;
  remote.setName(typeof data.name === "string" ? data.name : "");
  updatePlayerStatus();
}

function removeRemotePlayer(uid) {
  const remote = remotePlayers.get(uid);
  if (!remote) return;

  scene.remove(remote.group);

  remote.group.traverse(object => {
    if (object.geometry) object.geometry.dispose();

    if (object.material) {
      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      for (const material of materials) {
        if (material.map) material.map.dispose();
        material.dispose();
      }
    }
  });

  remotePlayers.delete(uid);
  updatePlayerStatus();
}

function subscribeToOtherPlayers() {
  onChildAdded(playersRef, snapshot => {
    upsertRemotePlayer(snapshot.key, snapshot.val());
  }, error => {
    console.error("Player listener error:", error);
    joinStatus.textContent = "Could not read the room. Check the database rules.";
  });

  onChildChanged(playersRef, snapshot => {
    upsertRemotePlayer(snapshot.key, snapshot.val());
  }, error => {
    console.error("Player update listener error:", error);
  });

  onChildRemoved(playersRef, snapshot => {
    removeRemotePlayer(snapshot.key);
  }, error => {
    console.error("Player removal listener error:", error);
  });
}

function currentPlayerData() {
  const data = {
    x: Number(player.position.x.toFixed(3)),
    y: Number(player.position.y.toFixed(3)),
    z: Number(player.position.z.toFixed(3)),
    rotationY: Number(player.rotation.y.toFixed(3)),
    updatedAt: Date.now()
  };

  if (displayName) data.name = displayName;
  return data;
}

async function publishPlayerState(force = false) {
  if (!joined || !myPlayerRef || writeInProgress) return;

  const now = Date.now();

  if (!force && now - lastNetworkUpdate < 140) return;

  lastNetworkUpdate = now;
  writeInProgress = true;

  try {
    await set(myPlayerRef, currentPlayerData());
  } catch (error) {
    console.error("Could not update player:", error);
    playerStatus.textContent = "Connection interrupted. Trying again...";
  } finally {
    writeInProgress = false;
  }
  }
  function explainJoinError(error) {
  console.error("Join error:", error);

  if (error && error.code === "auth/unauthorized-domain") {
    return "Firebase needs this website added to Authentication's Authorized domains.";
  }

  if (error && (error.code === "PERMISSION_DENIED" ||
      error.code === "database/permission-denied")) {
    return "Firebase denied access. We'll check the Realtime Database rules.";
  }

  if (error && error.code === "auth/network-request-failed") {
    return "Network connection failed. Check your internet and try again.";
  }

  return "Couldn't connect right now. Check your internet and try again.";
}

async function enterWorld() {
  if (joined) return;

  joinButton.disabled = true;
  joinStatus.textContent = "Connecting to your world...";
  displayName = nameInput.value.trim().slice(0, 20);

  try {
    if (!auth || !database || !playersRef) {
      throw new Error("Firebase was not initialized.");
    }

    const credential = await signInAnonymously(auth);
    myUid = credential.user.uid;
    myPlayerRef = ref(database, `rooms/${ROOM_ID}/players/${myUid}`);

    await onDisconnect(myPlayerRef).remove();
    await set(myPlayerRef, currentPlayerData());

    joined = true;
    subscribeToOtherPlayers();
    updatePlayerStatus();

    joinScreen.style.display = "none";
    document.getElementById("message").style.display = "block";

    if (window.matchMedia("(max-width: 800px)").matches) {
      jumpButton.style.display = "flex";
    }

  } catch (error) {
    joinButton.disabled = false;
    joinStatus.textContent = explainJoinError(error);
  }
}

joinButton.addEventListener("click", enterWorld);

nameInput.addEventListener("keydown", event => {
  if (event.key === "Enter") enterWorld();
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);

  if (joined) {
    jumpButton.style.display =
      window.matchMedia("(max-width: 800px)").matches ? "flex" : "none";
  }
});
  const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  if (joined) {

    // CAMERA-RELATIVE MOVEMENT
    let forward =
      (keys.w || keys.arrowup ? 1 : 0) -
      (keys.s || keys.arrowdown ? 1 : 0) + stickY;

    let strafe =
      (keys.d || keys.arrowright ? 1 : 0) -
      (keys.a || keys.arrowleft ? 1 : 0) + stickX;

    const inputLength = Math.hypot(forward, strafe);

    if (inputLength > 1) {
      forward /= inputLength;
      strafe /= inputLength;
    }

    isMoving = inputLength > 0.06;

    if (isMoving) {
      const moveX =
        -Math.sin(cameraYaw) * forward +
        Math.cos(cameraYaw) * strafe;

      const moveZ =
        -Math.cos(cameraYaw) * forward -
        Math.sin(cameraYaw) * strafe;

      player.position.x = THREE.MathUtils.clamp(
        player.position.x + moveX * speed * delta,
        -125, 125
      );

      player.position.z = THREE.MathUtils.clamp(
        player.position.z + moveZ * speed * delta,
        -125, 125
      );

      player.rotation.y = Math.atan2(-moveX, -moveZ);
    }

    // JUMPING AND GRAVITY
    if (jumpRequested && grounded) {
      verticalVelocity = jumpPower;
      grounded = false;
    }

    jumpRequested = false;

    if (!grounded) {
      verticalVelocity -= gravity * delta;
      player.position.y += verticalVelocity * delta;

      if (player.position.y <= 0) {
        player.position.y = 0;
        verticalVelocity = 0;
        grounded = true;
      }
    }

    // LOCAL CHARACTER ANIMATION
    localCharacter.updateAnimation(
      isMoving,
      !grounded,
      elapsed
    );

    // REMOTE PLAYER MOVEMENT AND JUMPING
    const smoothing = 1 - Math.exp(-12 * delta);

    for (const remote of remotePlayers.values()) {

      const remoteWasMoving = Math.hypot(
        remote.targetX - remote.group.position.x,
        remote.targetZ - remote.group.position.z
      ) > 0.025;

      remote.group.position.x +=
        (remote.targetX - remote.group.position.x) * smoothing;

      remote.group.position.y +=
        (remote.targetY - remote.group.position.y) * smoothing;

      remote.group.position.z +=
        (remote.targetZ - remote.group.position.z) * smoothing;

      const angleDifference = Math.atan2(
        Math.sin(remote.targetRotationY - remote.group.rotation.y),
        Math.cos(remote.targetRotationY - remote.group.rotation.y)
      );

      remote.group.rotation.y += angleDifference * smoothing;

      remote.updateAnimation(
        remoteWasMoving,
        remote.targetY > 0.08 || remote.group.position.y > 0.08,
        elapsed
      );
    }

    publishPlayerState();

  } else {
    localCharacter.updateAnimation(false, false, elapsed);
  }


  // CAMERA FOLLOW AND SMOOTH ZOOM

cameraDistance = THREE.MathUtils.damp(
  cameraDistance,
  targetCameraDistance,
  8,
  delta
);

const firstPerson = cameraDistance <= 0.72;

player.visible = !firstPerson;

if (firstPerson) {

  // First-person camera at the avatar's eye level.
  camera.position.set(
    player.position.x,
    player.position.y + 2.12,
    player.position.z
  );

  camera.lookAt(
    player.position.x - Math.sin(cameraYaw) * 10,
    player.position.y + 2.12,
    player.position.z - Math.cos(cameraYaw) * 10
  );

} else {

  // Normal third-person camera.
  camera.position.set(
    player.position.x + Math.sin(cameraYaw) * cameraDistance,
    player.position.y + Math.max(1.6, 0.5 + cameraDistance * 0.5),
    player.position.z + Math.cos(cameraYaw) * cameraDistance
  );

  camera.lookAt(
    player.position.x,
    player.position.y + 1.4,
    player.position.z
  );
}

// Widen the field of view when zoomed out.
const desiredFov = 65 +
  THREE.MathUtils.clamp((cameraDistance - 10) / 16, 0, 1) * 15;

const nextFov = THREE.MathUtils.damp(
  camera.fov,
  desiredFov,
  5,
  delta
);

if (Math.abs(nextFov - camera.fov) > 0.01) {
  camera.fov = nextFov;
  camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

animate();

loading.style.display = "none";
joinScreen.style.display = "flex";
joinStatus.textContent = "Your world is ready. Press Enter to join.";

</script>
