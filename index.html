<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>The World</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: Arial, sans-serif; background: #9ed8f4; touch-action: none;
}
#game { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#message {
  position: fixed; top: 16px; left: 16px; z-index: 5;
  padding: 11px 15px; border-radius: 12px; color: #fff;
  background: rgba(20, 45, 35, 0.68); font-size: 14px; line-height: 1.5;
  max-width: 250px; pointer-events: none; display: none;
}
#joystick {
  position: fixed; z-index: 6; left: 25px; bottom: 28px;
  width: 125px; height: 125px; border-radius: 50%;
  background: rgba(255,255,255,0.20); border: 2px solid rgba(255,255,255,0.55);
  display: none; touch-action: none;
}
#knob {
  position: absolute; width: 52px; height: 52px; left: 50%; top: 50%;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: rgba(255,255,255,0.85); border: 2px solid rgba(80,120,90,0.5);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
#loading {
  position: fixed; inset: 0; display: grid; place-items: center;
  color: #24412d; font-size: 20px; background: #b9e7c0; z-index: 10;
}
#joinScreen {
  position: fixed; inset: 0; z-index: 11; display: none;
  align-items: center; justify-content: center; padding: 22px;
  background: rgba(17, 42, 31, 0.28); backdrop-filter: blur(5px);
}
#joinCard {
  width: min(100%, 360px); padding: 26px 22px; border-radius: 22px;
  text-align: center; color: #29442f; background: rgba(255, 252, 239, 0.96);
  box-shadow: 0 15px 45px rgba(20, 45, 35, 0.22);
}
#joinCard h1 { margin: 0 0 8px; font-size: 29px; }
#joinCard p { margin: 0 0 18px; line-height: 1.5; font-size: 14px; }
#playerName {
  width: 100%; padding: 13px 14px; border: 1px solid #c6d2bd;
  border-radius: 12px; font-size: 16px; outline: none; color: #243c2b;
  background: #fff; touch-action: auto;
}
#playerName:focus { border-color: #5f9c65; box-shadow: 0 0 0 3px rgba(95,156,101,0.15); }
#enterButton {
  width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px;
  color: white; background: #518d58; font-size: 16px; font-weight: bold;
  cursor: pointer; touch-action: manipulation;
}
#enterButton:disabled { opacity: 0.65; cursor: wait; }
#joinStatus { min-height: 20px; margin: 12px 0 0 !important; color: #637568; font-size: 12px !important; }
#joinHint { margin-top: 10px !important; margin-bottom: 0 !important; font-size: 11px !important; color: #758174; }
@media (max-width: 800px) {
  #joystick { display: block; }
  #message { top: 10px; left: 10px; font-size: 12px; max-width: 205px; }
}
</style>

// TREES
function makeTree(x, z, scale = 1) {

// CHARACTER CREATOR (used for both you and your friend)
function createCharacter(shirtColor) {
  const group = new THREE.Group();
  const shirt = new THREE.Mesh(
    new THREE.CylinderGeometry(0.37, 0.47, 0.95, 8),
    new THREE.MeshStandardMaterial({ color: shirtColor })
  );
  shirt.position.y = 1.05;
  group.add(shirt);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.36, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xf0c39c })
  );
  head.position.y = 1.83;
  group.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.365, 12, 8, 0, Math.PI * 2, 0, Math.PI * 0.48),
    new THREE.MeshStandardMaterial({ color: 0x48342d })
  );
  hair.position.y = 1.91;
  group.add(hair);

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x252525 });
  for (const x of [-0.12, 0.12]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), eyeMat);
    eye.position.set(x, 1.86, -0.315);
    group.add(eye);
  }

  const armMat = new THREE.MeshStandardMaterial({ color: 0xf0c39c });
  for (const x of [-0.48, 0.48]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.72, 7), armMat);
    arm.position.set(x, 1.1, 0);
    group.add(arm);
  }

  const legMat = new THREE.MeshStandardMaterial({ color: 0x35445e });
  for (const x of [-0.19, 0.19]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.14, 0.65, 7), legMat);
    leg.position.set(x, 0.34, 0);
    group.add(leg);
  }

  // Name label floats over the character. A blank name hides it.
  const labelCanvas = document.createElement("canvas");
  labelCanvas.width = 512;
  labelCanvas.height = 128;
  const labelContext = labelCanvas.getContext("2d");
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  const labelMaterial = new THREE.SpriteMaterial({ map: labelTexture, transparent: true, depthWrite: false });
  const labelSprite = new THREE.Sprite(labelMaterial);
  labelSprite.position.y = 2.55;
  labelSprite.scale.set(2.15, 0.54, 1);
  labelSprite.visible = false;
  group.add(labelSprite);

  function setName(name) {
    const safeName = String(name || "").trim().slice(0, 20);
    labelContext.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    if (!safeName) {
      labelSprite.visible = false;
      labelTexture.needsUpdate = true;
      return;
    }
    labelContext.fillStyle = "rgba(25, 42, 30, 0.72)";
    labelContext.beginPath();
    if (typeof labelContext.roundRect === "function") {
      labelContext.roundRect(22, 18, 468, 92, 28);
    } else {
      labelContext.rect(22, 18, 468, 92);
    }
    labelContext.fill();
    labelContext.fillStyle = "#ffffff";
    labelContext.font = "bold 48px Arial";
    labelContext.textAlign = "center";
    labelContext.textBaseline = "middle";
    labelContext.fillText(safeName, 256, 65, 430);
    labelSprite.visible = true;
    labelTexture.needsUpdate = true;
  }

  return { group, setName };
}

const keys = {};

window.addEventListener("keydown", event => {

// MOBILE JOYSTICK
const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");
let stickPointer = null;
function moveStick(event) {
  const rect = joystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;
  const maxDistance = 38;
  const distance = Math.hypot(dx, dy);
  if (distance > maxDistance) { dx = dx / distance * maxDistance; dy = dy / distance * maxDistance; }
  stickX = dx / maxDistance;
  stickY = -dy / maxDistance;
  knob.style.left = `calc(50% + ${dx}px)`;
  knob.style.top = `calc(50% + ${dy}px)`;
}
joystick.addEventListener("pointerdown", event => {
  if (!joined) return;
  stickPointer = event.pointerId;
  joystick.setPointerCapture(event.pointerId);
  moveStick(event);
});
joystick.addEventListener("pointermove", event => {
  if (event.pointerId === stickPointer) moveStick(event);
});
function releaseStick(event) {
  if (event.pointerId !== stickPointer) return;
  stickPointer = null; stickX = 0; stickY = 0;
  knob.style.left = "50%"; knob.style.top = "50%";
}
joystick.addEventListener("pointerup", releaseStick);
joystick.addEventListener("pointercancel", releaseStick);

// CAMERA LOOK: DRAG WITH MOUSE OR FINGER
const canvas = renderer.domElement;
let lookPointer = null;
let previousX = 0;
canvas.addEventListener("pointerdown", event => {
  if (!joined) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;
  lookPointer = event.pointerId;
  previousX = event.clientX;
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (event.pointerId !== lookPointer) return;
  const difference = event.clientX - previousX;
  cameraYaw -= difference * 0.006;
  previousX = event.clientX;
});
function stopLooking(event) { if (event.pointerId === lookPointer) lookPointer = null; }
canvas.addEventListener("pointerup", stopLooking);
canvas.addEventListener("pointercancel", stopLooking);

// MULTIPLAYER HELPERS
function updatePlayerStatus() {
  const count = 1 + remotePlayers.size;
  if (count === 1) {
    playerStatus.textContent = "Connected · waiting for your friend...";
  } else if (count === 2) {
    playerStatus.textContent = "You're together! ✨";
  } else {
    playerStatus.textContent = `${count} players are here.`;
  }
}

function validPlayerData(data) {
  return data && Number.isFinite(data.x) && Number.isFinite(data.z) &&
    Number.isFinite(data.rotationY) && Number.isFinite(data.updatedAt);
}

function shirtColorFor(uid) {
  const colors = [0xd47ca4, 0x8d79cc, 0xe0a04e, 0x4aaca5, 0xc56f61];
  let hash = 0;
  for (let i = 0; i < uid.length; i++) hash = (hash * 31 + uid.charCodeAt(i)) >>> 0;
  return colors[hash % colors.length];
}

function upsertRemotePlayer(uid, data) {
  if (uid === myUid || !validPlayerData(data)) return;
  let remote = remotePlayers.get(uid);
  if (!remote) {
    const character = createCharacter(shirtColorFor(uid));
    scene.add(character.group);
    character.group.position.set(data.x, 0, data.z);
    character.group.rotation.y = data.rotationY;
    remote = {
      group: character.group,
      setName: character.setName,
      targetX: data.x,
      targetZ: data.z,
      targetRotationY: data.rotationY
    };
    remotePlayers.set(uid, remote);
  }
  remote.targetX = THREE.MathUtils.clamp(data.x, -115, 115);
  remote.targetZ = THREE.MathUtils.clamp(data.z, -115, 115);
  remote.targetRotationY = data.rotationY;
  remote.setName(typeof data.name === "string" ? data.name : "");
  updatePlayerStatus();
}

function removeRemotePlayer(uid) {
  const remote = remotePlayers.get(uid);
  if (!remote) return;
  scene.remove(remote.group);
  remote.group.traverse(object => {
    if (object.geometry) object.geometry.dispose();
    if (object.material) {
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      for (const material of materials) {
        if (material.map) material.map.dispose();
        material.dispose();
      }
    }
  });
  remotePlayers.delete(uid);
  updatePlayerStatus();
}

function subscribeToOtherPlayers() {
  onChildAdded(playersRef, snapshot => upsertRemotePlayer(snapshot.key, snapshot.val()), error => {
    console.error("Player listener error:", error);
    joinStatus.textContent = "Could not read the room. Check the database rules.";
  });
  onChildChanged(playersRef, snapshot => upsertRemotePlayer(snapshot.key, snapshot.val()), error => {
    console.error("Player update listener error:", error);
  });
  onChildRemoved(playersRef, snapshot => removeRemotePlayer(snapshot.key), error => {
    console.error("Player removal listener error:", error);
  });
}

function currentPlayerData() {
  const data = {
    x: Number(player.position.x.toFixed(3)),
    z: Number(player.position.z.toFixed(3)),
    rotationY: Number(player.rotation.y.toFixed(3)),
    updatedAt: Date.now()
  };
  if (displayName) data.name = displayName;
  return data;
}

async function publishPlayerState(force = false) {
  if (!joined || !myPlayerRef || writeInProgress) return;
  const now = Date.now();
  if (!force && now - lastNetworkUpdate < 140) return;
  lastNetworkUpdate = now;
  writeInProgress = true;
  try {
    await set(myPlayerRef, currentPlayerData());
  } catch (error) {
    console.error("Could not update player:", error);
    playerStatus.textContent = "Connection interrupted. Trying again...";
  } finally {
    writeInProgress = false;
  }
}

function explainJoinError(error) {
  console.error("Join error:", error);
  if (error && error.code === "auth/unauthorized-domain") {
    return "Firebase needs this website added to Authentication's Authorized domains. We'll fix that next.";
  }
  if (error && (error.code === "PERMISSION_DENIED" || error.code === "database/permission-denied")) {
    return "Firebase denied access. We'll check the Realtime Database rules.";
  }
  if (error && error.code === "auth/network-request-failed") {
    return "Network connection failed. Check your internet and try again.";
  }
  return "Couldn't connect right now. Check your internet and try again.";
}

async function enterW
